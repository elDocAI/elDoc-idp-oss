# ****************************************************************************************************
# AI & LLM Settings
# ai.model.*.provider         - Model provider. Supported values: 'openai', 'bedrock'
# ai.model.*.secret           - Provider API key or secret
# ai.model.*.modelId          - Provider model ID
# ai.model.*.timeoutSec       - Provider endpoint request timeout in seconds (default: 60)
# ai.model.*.bedrock.region   - AWS Bedrock region
# ai.model.*.bedrock.keyId    - AWS Bedrock Access Key ID (Access Key Secret must be provided via *.secret param)
# ai.model.*.requestMaxSizeMB - Maximum allowed request body size in MB, -1 for unlimited (default: 4.5)
# ai.model.*.openai.endpoint  - OpenAI-compatible API endpoint URL (default: https://api.openai.com/v1)
# ai.model.*.param.KEY=VALUE  - Additional parameters to include in requests sent to the model
# ai.model.*.maxTokensOut     - Maximum number of tokens generated per model call. Default: not set (uses provider's defaults).
#                               Recommended: set the maximum value supported by the selected model
#

# AI & LLM Model Configuration – Agent
ai.model.agent.provider=${env:ELDOC_AI_AGENT_PROVIDER}
ai.model.agent.secret=${env:ELDOC_AI_AGENT_SECRET}
ai.model.agent.modelId=${env:ELDOC_AI_AGENT_MODEL_ID}
ai.model.agent.timeoutSec=${env:ELDOC_AI_AGENT_TIMEOUT_SEC}
ai.model.agent.maxTokensOut=${env:ELDOC_AI_AGENT_MAX_TOKENS_OUT}
ai.model.agent.bedrock.region=${env:ELDOC_AI_AGENT_BEDROCK_REGION}
ai.model.agent.bedrock.keyId=${env:ELDOC_AI_AGENT_BEDROCK_KEY_ID}
ai.model.agent.openai.endpoint=${env:ELDOC_AI_AGENT_OPENAI_ENDPOINT}

# AI & LLM Model Configuration – Vision-Language (VL) Model
ai.model.vl.provider=${env:ELDOC_AI_VL_PROVIDER}
ai.model.vl.secret=${env:ELDOC_AI_VL_SECRET}
ai.model.vl.modelId=${env:ELDOC_AI_VL_MODEL_ID}
ai.model.vl.timeoutSec=${env:ELDOC_AI_VL_TIMEOUT_SEC}
ai.model.vl.maxTokensOut=${env:ELDOC_AI_VL_MAX_TOKENS_OUT}
ai.model.vl.bedrock.region=${env:ELDOC_AI_VL_BEDROCK_REGION}
ai.model.vl.bedrock.keyId=${env:ELDOC_AI_VL_BEDROCK_KEY_ID}
ai.model.vl.openai.endpoint=${env:ELDOC_AI_VL_OPENAI_ENDPOINT}
