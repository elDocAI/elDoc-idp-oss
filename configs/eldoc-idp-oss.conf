# ******************************************************************************************************
# Tenant Settings
# tenantId            - 1–20 chars, must match MongoDB DB name suffix (e.g., eldoc_prd1 → prd1)
#                       Allowed: [a-zA-Z0-9_]
# <tenantId>.db.conn  - MongoDB connection string (escape commas with "\")
#                       Example: mongodb://host1:port1\,host2:port2[\,hostN[:portN]]/[database][?options]
# <tenantId>.db.user  - MongoDB username
# <tenantId>.db.pwd   - MongoDB password
# <tenantId>.db.auth  - Optional: Authentication source (authSource). Resolved at runtime as: eldoc_{tenantId}
# <tenantId>.db.name  - Optional: Tenant DB name. Resolved at runtime as: eldoc_{tenantId}
# <tenantId>.db.tls   - Optional: true|false, enables TLS (can also be set in db.conn URI with ?tls=true)
# <tenantId>.db.ts    - Optional: Path to TrustStore. Uses system TrustStore by default
# <tenantId>.db.tsPwd - Optional: TrustStore Password
# <tenantId>.db.ks    - Optional: Path to KeyStore (client certificate/X.509/mTLS). Unset by default
# <tenantId>.db.ksPwd - Optional: KeyStore Password
# <tenantId>.domain   - Optional: Tenant FQDN (e.g., eldoc.domain.com); responds to all domains if not set
#
tenantId=idposs
idposs.db.conn=${env:ELDOC_MONGODB_URI}
# Note: Expected db name: eldoc_idposs
idposs.db.user=${env:ELDOC_MONGODB_USER}
idposs.db.pwd=${env:ELDOC_MONGODB_PASSWORD}


# ******************************************************************************************************
# Embedded MongoDB fallback
# Starts automatically when no db.conn value provided. An external URI above always takes precedence.
# Blank values use the defaults shown below.
# embeddedMongo.dataDir        - database files; default: ${java.io.tmpdir}/eldoc-idp-oss-db-data
# embeddedMongo.binaryCacheDir - downloaded mongod binaries; default: ${java.io.tmpdir}/eldoc-idp-oss-db-bin
#
embeddedMongo.dataDir=${env:ELDOC_EMBEDDED_MONGODB_DATA_DIR}
embeddedMongo.binaryCacheDir=${env:ELDOC_EMBEDDED_MONGODB_BINARY_CACHE_DIR}


# ******************************************************************************************************
# General settings
# url.cipherKey - Base64-encoded cipher key for protecting sensitive URL-params, size: 128-448 bits.
#                 Generated on system boot in case not provided.
#                 IMPORTANT: always replace default value after system deployment
# i18n.langs    - enabled system languages when no tenant context is available (e.g. on login page, etc.)
#                 Accepted values: en, uk, es, ms, zht (Chinese Traditional), zhs (Chinese Simplified)
#                 Defaults to all available languages in case not explicitly set
#
url.cipherKey=
#i18n.langs=en, uk, es, ms, zht, zhs


# ******************************************************************************************************
# IDP settings
# idp.ocr.type                - OCR engine type (system wide). Supported values:
#                               - 'tess' - Tesseract (embedded)
#                               - 'vl'   - AI/LLM OCR using OpenAI API (e.g. Qwen3-VL running llama.cpp)
#                               - 'pddl' - PaddleOCR API
# idp.ocr.type.<tenantId>     - OCR engine type override for the specific tenantId
# idp.ocr.url                 - OCR API base URL (used with PaddleOCR API, e.g.: http://localhost:8050)
# idp.tessdata.path           - path to TessData directory. Use escaped backslashes (\\) for path in the Windows OS
idp.ocr.type=tess
#idp.ocr.url=
idp.tessdata.path=${env:ELDOC_OCR_TESSDATA_DIR}


# ******************************************************************************************************
# AI & LLM Settings
#
# Complete AI/LLM sample config file
# include = eldoc-idp-oss-ai.conf
#
# AI/LLM config sample for AWS Bedrock
# include = eldoc-idp-oss-ai.aws.conf
#
# AI/LLM config sample for OpenRouter
include = eldoc-idp-oss-ai.openrouter.conf