<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 170" role="img" aria-labelledby="title desc">
  <title id="title">elDoc IDP OSS Processing Workflow</title>
  <desc id="desc">Document Ingestion, OCR and Preprocessing, AI Classification and Extraction, Validation (Human Review), Storage, CSV Export.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#8996A5"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    <g fill="none" stroke="#8996A5" stroke-width="2" marker-end="url(#arrow)">
      <path d="M210 85 H248"/>
      <path d="M450 85 H488"/>
      <path d="M738 85 H776"/>
      <path d="M1006 85 H1044"/>
      <path d="M1204 85 H1242"/>
    </g>
    <rect x="20" y="43" width="190" height="84" rx="10" fill="#E8F0FA" stroke="#6487B5" stroke-width="1.5"/>
    <text x="115" y="80" fill="#27486D"><tspan x="115">Document</tspan><tspan x="115" dy="23">Ingestion</tspan></text>

    <rect x="250" y="43" width="200" height="84" rx="10" fill="#E6F2DD" stroke="#689F38" stroke-width="1.5"/>
    <text x="350" y="80" fill="#36571F"><tspan x="350">OCR &amp;</tspan><tspan x="350" dy="23">Preprocessing</tspan></text>

    <rect x="490" y="43" width="248" height="84" rx="10" fill="#E6F2DD" stroke="#689F38" stroke-width="1.5"/>
    <text x="614" y="80" fill="#36571F"><tspan x="614">AI Classification</tspan><tspan x="614" dy="23">&amp; Extraction</tspan></text>

    <rect x="778" y="43" width="228" height="84" rx="10" fill="#E5F4F1" stroke="#399A89" stroke-width="1.5"/>
    <text x="892" y="80" fill="#21665B"><tspan x="892">Validation</tspan><tspan x="892" dy="23">(Human Review)</tspan></text>

    <rect x="1046" y="43" width="158" height="84" rx="10" fill="#FFF2DD" stroke="#D5A047" stroke-width="1.5"/>
    <text x="1125" y="91" fill="#79551B">Storage</text>

    <rect x="1244" y="43" width="186" height="84" rx="10" fill="#E6F2DD" stroke="#689F38" stroke-width="2"/>
    <text x="1337" y="80" fill="#36571F"><tspan x="1337">CSV</tspan><tspan x="1337" dy="23">Export</tspan></text>
  </g>
</svg>
