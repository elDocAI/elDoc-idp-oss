<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">

    <!-- IDP AI Settings -->
    <p:panel header="#{labels['pAdminConfig.idpConfig']}" collapsed="false">

        <div class="grid">

            <div class="col-5">
                <p:outputLabel value="${labels['pAdminConfig.idpConfig.defaultModelClassification']}" for="mdlIdpCls"/>
            </div>
            <div class="col-7 p-fluid">
                <p:selectOneMenu id="mdlIdpCls" value="#{configController.idpClassificationModelDefault}" label="#{labels['pAdminConfig.idpConfig.defaultModelClassification']}"
                                 hideNoSelectionOption="#{not empty configController.aiDefaultModelAgentSI}"
                                 converter="stringTrimConverter" disabled="#{configController.modeRead or not configController.idpClassificationModelDefaultConfigurable}">
                    <f:selectItem itemValue="" noSelectionOption="true" itemLabel="#{labels['pAdminConfig.aiConfig.noModelSelected']}"/>
                    <f:selectItems value="#{configController.aiDefaultModelAgentSI}"/>
                </p:selectOneMenu>
            </div>

            <div class="col-5">
                <p:outputLabel value="${labels['pAdminConfig.idpConfig.defaultModelExtraction']}" for="mdlIdpExtr"/>
            </div>
            <div class="col-7 p-fluid">
                <p:selectOneMenu id="mdlIdpExtr" value="#{configController.idpExtractionModelDefault}" label="#{labels['pAdminConfig.idpConfig.defaultModelExtraction']}" hideNoSelectionOption="#{not empty configController.aiDefaultModelVisionSI}"
                                 converter="stringTrimConverter" disabled="#{configController.modeRead or not configController.idpExtractionModelDefaultConfigurable}">
                    <f:selectItem itemValue="" noSelectionOption="true" itemLabel="#{labels['pAdminConfig.aiConfig.noModelSelected']}"/>
                    <f:selectItems value="#{configController.aiDefaultModelVisionSI}"/>
                </p:selectOneMenu>
            </div>

            <ui:fragment rendered="#{recoQueueController.classificationAvailable}">
                <div class="col-5">
                    <p:outputLabel value="#{labels['pAdminConfig.idp.autoClassification']}" for="autoClsf"/>
                </div>
                <div class="col-7 p-fluid">
                    <p:toggleSwitch id="autoClsf" value="#{configController.idpConfig.autoClassification}" label="#{labels['pAdminConfig.idp.autoClassification']}"
                                    converter="jakarta.faces.Boolean" disabled="#{!userContext.adminSysRW || configController.modeRead}" onIcon="pi pi-times" offIcon="pi pi-check"/>
                </div>
            </ui:fragment>

        </div>

    </p:panel>

</ui:composition>
