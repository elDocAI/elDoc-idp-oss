<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
>


    <!-- RecoForm post-processing settings -->

    <div class="col-12">
        <p:selectBooleanCheckbox id="useFormPostproc" value="#{recoFormController.recoForm.usePostProc}"
                                 label="#{labels['pRecoForm.usePostProc']}"
                                 itemLabel="#{labels['pRecoForm.usePostProc']}"
                                 disabled="#{recoFormController.modeRead}"/>
    </div>

    <div class="col-12 p-fluid">
        <div id="editor" class="code-editor-shell">
            <h:inputTextarea id="formPostProc" value="#{recoFormController.recoForm.postProc}" styleClass="code-editor" style="display: none;"
                             converter="stringToBase64Converter" readonly="#{recoFormController.modeRead}"/>
        </div>
    </div>

    <div class="col-12 muted" style="font-size: 95%;">
        <ui:include src="/WEB-INF/includes/admin/recoForm/postProcHintForm.xhtml" />
    </div>

</ui:composition>
