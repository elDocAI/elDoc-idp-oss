<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="jakarta.faces.facelets"
>

    <!-- License info on concurrent connections -->
    <ui:fragment rendered="#{not pageController.hasLicensedSessionSlot()}">
        <script>
            document.body.style.overflow = "hidden";
            document.body.style.position = "fixed";
        </script>
        <div class="lic-overlay">
            <div class="lic-overlay-content">
                <div class="lic-overlay-content-inner">
                    <h2>#{labels['msg.license.users.concur.exceeded']}</h2>
                    <hr/>
                    <span>#{labels['msg.license.users.concur.exceeded.note1']}</span>
                </div>
            </div>
        </div>
    </ui:fragment>

</ui:composition>
