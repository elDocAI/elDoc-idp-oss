<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:p="primefaces"
        xmlns:cc="jakarta.faces.composite/elcomp"
>

    <!-- Name Picker Dialog: Single selection mode -->
    <div class="grid grid-nogutter">

        <div class="col-12 lg:col-5 np-left-panel">
            <p:dataTable id="diPkrTbl" widgetVar="diPkrTblWV" value="#{uiNamePicker.lazyDS}" lazy="true" var="rowData" rowIndexVar="rowIndex"
                         rowKey="#{rowData.getId()}" selection="#{uiNamePicker.sourceDISelected}" selectionRowMode="add" selectionMode="single"
                         paginator="false" scrollable="true" scrollRows="25" scrollHeight="200" virtualScroll="true"
                         emptyMessage="#{labels['general.dataTable.noRecordsFound']}" filterDelay="800" selectionDisabled="#{uiNamePicker.isDisabledSelection(rowData)}" >

                <p:column selectionBox="true" width="20" />

                <p:column headerText="#{labels['ccNamePicker.itemsSelection']}">
                    <h:outputText value="#{rowData}" converter="directoryItemNameConverter" />
                </p:column>

            </p:dataTable>
        </div>

        <div class="col-12 lg:col-2 np-mid-panel p-picklist">
            <div class="p-picklist-buttons">
                <p:commandButton id="addSelectedBtn" action="#{uiNamePicker.addSelected()}" process="diPkrTbl addSelectedBtn" update="diPkrTbl diSelTbl"
                                 title="#{labels['ccNamePicker.btn.addSelected']}" icon="ui-icon-arrow-1-e" />
                <p:commandButton id="removeSelectedBtn" action="#{uiNamePicker.removeSelected()}" process="diSelTbl removeSelectedBtn" update="diPkrTbl diSelTbl"
                                 title="#{labels['ccNamePicker.btn.removeSelected.title']}" icon="ui-icon-arrow-1-w" class="p-button-secondary p-button-outlined" />
                <p:commandButton id="removeAllBtn" action="#{uiNamePicker.removeAll()}" process="removeAllBtn" update="diPkrTbl diSelTbl" onstart="PF('diPkrTblWV').unselectAllRows();"
                                 title="#{labels['ccNamePicker.btn.removeAll.title']}" icon="ui-icon-arrowstop-1-w" class="p-button-secondary p-button-outlined" />
            </div>
        </div>

        <div class="col-12 lg:col-5 np-right-panel">
            <p:dataTable id="diSelTbl" value="#{uiNamePicker.targetDIList}" var="rowData" rowIndexVar="rowIndex"
                         rowKey="#{rowData.getId()}" selection="#{uiNamePicker.targetDISelected}"
                         paginator="false" scrollable="true" scrollHeight="200" emptyMessage="#{labels['ccNamePicker.noItemsSelected']}">

                <p:column selectionBox="true" width="20" />

                <p:column headerText="#{labels['ccNamePicker.selectedItems']}">
                    <cc:nameItem value="#{rowData.idSys}" />
                </p:column>

            </p:dataTable>
        </div>

    </div>

</ui:composition>
