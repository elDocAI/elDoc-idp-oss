<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:p="primefaces"
        xmlns:jsf="jakarta.faces"
        xmlns:cc="jakarta.faces.composite/elcomp">

    <div class="procBldrCntnt">

        <div jsf:id="procStps">

            <table class="procUsers">

                <ui:repeat value="#{processSteps}" var="stepData" varStatus="status" >

                    <tr>

                        <td class="phase">
                            <p:outputLabel value="#{labels['general.docs.author']}" rendered="#{status.index == 0}" />
                            <p:outputLabel value="#{labels['general.workflow.step']} #{status.index}" rendered="#{status.index > 0}" />
                        </td>

                        <td class="phaseContent">

                            <cc:nameList value="#{stepData.namesAll}" />

                            <cc:namePicker objectBean="#{processSteps[status.index]}"
                                           bindTo="#{stepData.namesAll}"
                                           bpmNames="#{bpmNames}"
                                           excludeNames="#{procState.getNamesAll(false, true)}"
                                           refreshId="#{refreshIdBase}:procStps"
                                           rendered="#{status.index > 0 and editable}" />

                        </td>

                    </tr>

                </ui:repeat>

            </table>

        </div>

    </div>

</ui:composition>
