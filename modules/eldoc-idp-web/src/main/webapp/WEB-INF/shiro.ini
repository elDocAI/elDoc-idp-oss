[main]
shiro.loginUrl = /login.xhtml
logout = org.apache.shiro.web.filter.authc.LogoutFilter
logout.redirectUrl = /
logout.postOnlyLogout = true

; User Auth Filter
authcUser = ai.eldoc.security.PassThruAuthenticationFilter
authcUser.loginUrl = /login.xhtml
authcUser.useRemembered = true

; Local Maintenance Mode Realm
localMaintenanceModeRealm = ai.eldoc.security.LocalMaintenanceModeRealm

; Security Manager global settings
securityManager = ai.eldoc.security.MultiTenantWebSecurityManager
securityManager.realms = $localMaintenanceModeRealm

; Auth Strategy
authcStrategy = org.apache.shiro.authc.pam.FirstSuccessfulStrategy
securityManager.authenticator.authenticationStrategy = $authcStrategy

; Redirect to an access denied page if user does not have access rights
roles.unauthorizedUrl = /access.xhtml


[urls]
; REST API Access (access to public api is allowed for anonymous):
/api/status = noSessionCreation, anon
/api/**/public/** = noSessionCreation, anon
/api/v2/** = roles[[elUser]]
/api/recoForm/import/auto = noSessionCreation, roles[[elUser]]
/api/preview/** = authcUser
; Allow logout particurarly
/api/uctx/** = authcUser

; WEB Pages Access:
/jakarta.faces.resource/elcomp/**/*.xhtml = perms[compositeComponent:access]
/jakarta.faces.resource/** = anon
/login.xhtml = anon
/access.xhtml = anon
/error.xhtml = anon
/404.xhtml = anon
/logout = logout
/admin/** = authcUser, perms[admin:view]
/mfa.xhtml = authcUser
/** = authcUser, roles[[elUser]]
