<ui:component
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:f="jakarta.faces.core"
        xmlns:composite="jakarta.faces.composite"
        xmlns:p="primefaces">

    <composite:interface>
        <composite:attribute name="dataSource" type="java.lang.Object" required="true" shortDescription="Document data source"/>
        <composite:attribute name="fieldName" type="java.lang.String" required="true" shortDescription="Field name"/>
        <composite:attribute name="label" type="java.lang.String" required="false" shortDescription="Field UI label"/>
        <composite:attribute name="required" type="java.lang.Boolean" required="false" shortDescription="Required flag"/>
        <composite:attribute name="disabled" type="java.lang.Boolean" required="true" shortDescription="Disabled flag"/>
    </composite:interface>

    <composite:implementation>

        <div class="col-12 lg:col-4">
            <p:outputLabel id="l1" value="#{cc.attrs.label}"/>
        </div>

        <div class="col-12 lg:col-8 p-fluid">
            <!-- TIMEZONE TO BE SET TO UTC ON cfDate COMPONENT -->
            <!-- We use only date part, which is assumed to be in UTC timezone and must not be affected by timezone offset -->
            <p:datePicker id="i1" value="#{cc.attrs.dataSource[cc.attrs.fieldName]}" autocomplete="off" disabled="#{cc.attrs.disabled}" required="#{cc.attrs.required}" label="#{cc.attrs.label}"
                          timeZone="UTC" pattern="#{userContext.dateFormat}" showTime="false"
                          showIcon="true" showOnFocus="false" monthNavigator="true" yearNavigator="true" showWeek="true" showOtherMonths="true" selectOtherMonths="true">
                <f:convertDateTime type="date" pattern="#{userContext.dateFormat}" timeZone="UTC"/>
            </p:datePicker>
        </div>

    </composite:implementation>

</ui:component>
