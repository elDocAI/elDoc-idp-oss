<ui:component
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces"
    xmlns:composite="jakarta.faces.composite"
    xmlns:cc="jakarta.faces.composite/elcomp"
    xmlns:h="jakarta.faces.html"
    xmlns:jsf="jakarta.faces"
    xmlns:f="jakarta.faces.core">

    <!--@elvariable id="dataSource" type="java.util.Map<java.lang.String, java.lang.Object>"-->

    <composite:interface>
        <composite:attribute name="dataSource" type="java.lang.Object" required="true" shortDescription="Document data source" />
        <composite:attribute name="fieldName" type="java.lang.String" required="true" shortDescription="Field name" />
        <composite:attribute name="label" type="java.lang.String" required="false" shortDescription="Field UI label" />
        <composite:attribute name="required" type="java.lang.Boolean" required="false" shortDescription="Required flag" />
        <composite:attribute name="disabled" type="java.lang.Boolean" required="true" shortDescription="Disabled flag" />
    </composite:interface>


    <composite:implementation>

        <div class="col-12 lg:col-4">
            <p:outputLabel id="l1" value="#{cc.attrs.label}" />
        </div>

        <div class="col-12 lg:col-8 p-fluid">
            <div jsf:id="cnt">

                <h:inputHidden value="#{cc.attrs.dataSource[cc.attrs.fieldName]}" required="#{cc.attrs.required}">
                    <f:attribute name="label" value="#{cc.attrs.label}" />
                </h:inputHidden>

                <cc:refItem id="rdItm" value="#{workflowController.getRefDocById(cc.attrs.dataSource[cc.attrs.fieldName])}" rendered="#{not empty cc.attrs.dataSource[cc.attrs.fieldName]}" />

                <cc:refWFPicker id="rdPkr" value="#{cc.attrs.dataSource[cc.attrs.fieldName]}" refreshId="#{cc.clientId}:cnt" singleSelect="true" rendered="#{!cc.attrs.disabled}" />

            </div>
        </div>

    </composite:implementation>

</ui:component>
