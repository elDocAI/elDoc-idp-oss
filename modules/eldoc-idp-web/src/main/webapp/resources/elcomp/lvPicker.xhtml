<ui:component
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces"
    xmlns:composite="jakarta.faces.composite">

    <composite:interface componentType="lvPicker">
        <composite:attribute name="dataSource" type="java.lang.Object" required="true" shortDescription="Document data source" />
        <composite:attribute name="fieldName" type="java.lang.String" required="true" shortDescription="Field name" />
        <composite:attribute name="idKf" type="java.lang.String" required="true" shortDescription="Foreign Key of the parent ListValue Directory to be used" />
        <composite:attribute name="label" type="java.lang.String" required="false" shortDescription="Field UI label" />
        <composite:attribute name="required" type="java.lang.Boolean" required="false" shortDescription="Required flag" />
        <composite:attribute name="disabled" type="java.lang.Boolean" required="true" shortDescription="Disabled flag" />
    </composite:interface>

    <composite:implementation>
        <p:autoComplete id="i1" value="#{cc.attrs.dataSource[cc.attrs.fieldName]}"
                        completeMethod="#{cc.completeListValue}" cache="true" maxResults="15" moreText="..."
                        multiple="false" selectLimit="1" autoSelection="true" forceSelection="true" dropdown="true" dynamic="true"
                        var="lvId" itemValue="#{lvId}" itemLabel="#{lvController.getLVData(lvId)}"
                        label="#{cc.attrs.label}" required="#{cc.attrs.required}" disabled="#{cc.attrs.disabled}"
                        emptyMessage="#{labels['general.dataTable.noRecordsFound']}" />
    </composite:implementation>

</ui:component>
