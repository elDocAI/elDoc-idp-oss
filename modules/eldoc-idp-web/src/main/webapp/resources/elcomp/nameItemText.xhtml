<ui:component
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces"
    xmlns:jsf="jakarta.faces"
    xmlns:c="jakarta.tags.core"
    xmlns:composite="jakarta.faces.composite">

    <composite:interface componentType="nameItem">
        <composite:attribute name="value" type="java.lang.Object" shortDescription="String representing systemId or Object of DirectoryItem class, or any successor: Person, Group, OrgUnit, etc." />
        <composite:attribute name="addStyleClass" type="java.lang.String" rendered="true" shortDescription="Custom css style" />
    </composite:interface>

    <composite:implementation>

        <c:set var="dirItemUrl" value="#{cc.getItemUrl(cc.valueData)}" />

        <p:link id="lnk" href="#{dirItemUrl}" title="#{cc.titleUI}" target="_blank" styleClass="userLink userLinkText white-space-nowrap #{cc.attrs.addStyleClass}" rendered="#{not empty dirItemUrl}" >
            <h:outputText value="#{cc.valueData}" converter="directoryItemNameConverter" />
        </p:link>

        <div jsf:id="blk" class="userLink userLinkText white-space-nowrap #{cc.attrs.addStyleClass}" jsf:rendered="#{empty dirItemUrl}">
            <h:outputText value="#{cc.valueData}" title="#{cc.titleUI}" converter="directoryItemNameConverter" />
        </div>

    </composite:implementation>

</ui:component>
