<ui:component
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:composite="jakarta.faces.composite"
    xmlns:cc="jakarta.faces.composite/elcomp">

    <composite:interface>
        <composite:attribute name="value" type="java.util.Collection" required="true" shortDescription="Collection or single value with nameItem systemId" />
    </composite:interface>

    <composite:implementation>

        <ui:repeat id="nlInner" value="#{cc.attrs.value}" var="systemId">
            <cc:nameItem id="ni" value="#{systemId}" />
        </ui:repeat>

    </composite:implementation>

</ui:component>
