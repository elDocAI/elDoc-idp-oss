<ui:component
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces"
    xmlns:composite="jakarta.faces.composite">

    <composite:interface>
        <composite:attribute name="value" type="ai.eldoc.model.RefItem" rendered="true" shortDescription="Model Object of RefDocItem class" />
    </composite:interface>

    <composite:implementation>

        <p:link id="rfdLnk"
                value="#{cc.attrs.value.text}"
                title="#{cc.attrs.value.title}"
                outcome="#{cc.attrs.value.value}"
                target="#{cc.attrs.value.target}"
                style="#{cc.attrs.value.style}"
                styleClass="refDocLink" />

    </composite:implementation>

</ui:component>
