<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:f="jakarta.faces.core"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:p="primefaces"
        xmlns:o="omnifaces"
        template="/WEB-INF/templates/template.xhtml">

    <ui:define name="metadata">
        <f:metadata>
            <f:viewAction action="#{pageController.pageLoadGlobalHandler}" immediate="true" />
            <f:viewAction action="#{wfListController.initOnPageLoad}" />
        </f:metadata>
    </ui:define>

    <ui:define name="title">${labels['menuUI.workflow.status']} | #{pageController.pageTitleSuffix}</ui:define>

    <ui:define name="content">

        <o:form id="f1">

            <div class="grid">
                <div class="col-12">
                    <div class="card card-page-header">
                        <h1>#{labels['menuUI.workflow.status']}</h1>
                    </div>
                </div>
            </div>

            <ui:include src="/WEB-INF/includes/workflow/list.xhtml" />

            <p:growl id="growl" globalOnly="true" life="5000" showDetail="true" skipDetailIfEqualsSummary="true" widgetVar="growlWV">
                <p:autoUpdate />
            </p:growl>

        </o:form>

    </ui:define>

</ui:composition>
